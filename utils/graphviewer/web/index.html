<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Comanda Graph</title>
  <style>
    :root { color-scheme:dark; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#0d1017; color:#e9edf5 }
    * { box-sizing:border-box } body { margin:0; height:100vh; display:grid; grid-template-columns:300px 1fr 310px; overflow:hidden }
    aside { background:#131824; border-right:1px solid #293143; padding:18px; overflow:auto } aside:last-child { border-left:1px solid #293143; border-right:0 }
    h1 { font-size:18px; margin:0 0 6px } h2 { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#91a0bd; margin:22px 0 10px }
    p,small { color:#aab5ca; line-height:1.45 } input { width:100%; padding:10px; border:1px solid #38435b; background:#0d1017; color:white; border-radius:7px }
    button,.result { width:100%; text-align:left; padding:9px; margin-top:6px; color:#dce4f5; border:1px solid transparent; background:#1b2231; border-radius:6px; cursor:pointer }
    button:hover,.result:hover { background:#28334a; border-color:#4c5f81 } label { display:block; margin:8px 0; font-size:13px; color:#c1cbe0 }
    main { position:relative; overflow:hidden; background:radial-gradient(circle at 50% 40%,#1b263b 0,#0d1017 55%) }
    #canvas { width:100%; height:100%; cursor:grab } .edge { stroke:#596883; stroke-opacity:.38 } .edge.inferred { stroke-dasharray:4 5; stroke:#e1a553 }
    .node { cursor:pointer; stroke:#e9edf5; stroke-width:1.2; transition:r .12s ease } .node:hover { stroke:#fff; stroke-width:3 } .node.selected { stroke:#fff; stroke-width:3 }
    .label { fill:#d9e2f2; font-size:11px; font-weight:600; pointer-events:none; paint-order:stroke; stroke:#0d1017; stroke-width:4px; stroke-linejoin:round }
    #status { position:absolute; top:14px; left:16px; padding:7px 10px; background:#111827cc; border:1px solid #31405a; border-radius:6px; color:#b7c4dc; font-size:12px }
    .muted { opacity:.7 } .tag { display:inline-block; padding:3px 6px; background:#25314a; border-radius:4px; margin:2px; font-size:11px }
    #details { font-size:13px; line-height:1.5 } .path { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; word-break:break-all }
  </style>
</head>
<body>
  <aside>
    <h1>Comanda Graph</h1><small id="namespace">Loading graph…</small>
    <h2>Search</h2><input id="search" placeholder="Symbol, file, package, concept"><div id="results"></div>
    <h2>Display</h2><label><input type="checkbox" id="inferred" checked> inferred relationships</label><label><input type="checkbox" id="labels" checked> node labels</label>
    <h2>Node kinds</h2><div id="kinds"></div>
    <p class="muted">The initial view is architecture only. Click a component to enter it, or search for a symbol. Scroll to zoom; drag empty space to pan.</p>
  </aside>
  <main><div id="status">Loading architectural overview…</div><svg id="canvas" aria-label="Knowledge graph"></svg></main>
  <aside><h2>Inspector</h2><div id="details"><p>Select a node or search result to explore just that scope.</p></div></aside>
  <script>
  const svg=document.querySelector('#canvas'),status=document.querySelector('#status'),details=document.querySelector('#details');
  const palette={component:'#8d72e8',package:'#45b6e8',file:'#46c794',type:'#ff9a58',function:'#f0ce54',concept:'#e177c3'};
  let overview,shown,selected,mode='overview',transform={x:0,y:0,scale:1},drag,kinds=new Set(),includeInferred=true,showLabels=true;
  const pageCache=new Map(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function json(url){const r=await fetch(url);const v=await r.json();if(!r.ok)throw new Error(v.error||r.statusText);return v}
  function graph(nodes=[],edges=[]){return {namespace:overview?.namespace||'',nodes,edges}}
  function nodeMap(){return new Map(shown.nodes.map(n=>[n.id,n]))}
  function setShown(next,nextMode=mode){shown=next;mode=nextMode;shown.nodes.forEach(n=>kinds.add(n.kind));filters();render()}
  async function load(){try{overview=await json('/api/v1/overview');setShown(graph(overview.nodes),'overview');const total=Object.values(overview.node_kind_counts).reduce((a,b)=>a+b,0);document.querySelector('#namespace').textContent=overview.namespace+' · '+total.toLocaleString()+' nodes · architecture overview'}catch(e){status.textContent='Unable to load graph: '+e.message}}
  function filters(){const holder=document.querySelector('#kinds'),existing=new Set([...holder.querySelectorAll('input')].map(x=>x.value));[...kinds].sort().forEach(kind=>{if(existing.has(kind))return;const id='kind-'+kind;holder.insertAdjacentHTML('beforeend',`<label><input id="${id}" value="${esc(kind)}" type="checkbox" checked> <span style="color:${palette[kind]||'#ccd'}">●</span> ${esc(kind)}</label>`);document.querySelector('#'+id).onchange=render})}
  function activeKinds(){return new Set([...kinds].filter(k=>document.querySelector('#kind-'+k)?.checked))}
  function compactLabel(name){return name.length>28?name.slice(0,27)+'…':name}
  function layout(nodes,w,h){const pos=new Map(),cx=w/2,cy=h/2;if(mode==='overview'){const columns=Math.max(3,Math.ceil(Math.sqrt(nodes.length*w/h))),rows=Math.ceil(nodes.length/columns),pad=72;nodes.forEach((n,i)=>pos.set(n.id,{x:pad+(i%columns)*(w-2*pad)/Math.max(columns-1,1),y:pad+Math.floor(i/columns)*(h-2*pad)/Math.max(rows-1,1)}));return pos}const focus=nodes.find(n=>n.id===selected?.id)||nodes[0];if(focus)pos.set(focus.id,{x:cx,y:cy});const peers=nodes.filter(n=>n.id!==focus?.id),radius=Math.min(w,h)*.34;peers.forEach((n,i)=>{const angle=(Math.PI*2*i)/Math.max(peers.length,1)-Math.PI/2;pos.set(n.id,{x:cx+Math.cos(angle)*radius,y:cy+Math.sin(angle)*radius})});return pos}
  function render(){if(!shown)return;const allowed=activeKinds(),nodes=shown.nodes.filter(n=>allowed.has(n.kind)),ids=new Set(nodes.map(n=>n.id)),edges=shown.edges.filter(e=>ids.has(e.source)&&ids.has(e.target)&&(includeInferred||e.confidence!=='inferred')),w=svg.clientWidth||900,h=svg.clientHeight||700,degree=new Map(nodes.map(n=>[n.id,n.degree||0])),pos=layout(nodes,w,h);
    const labelLimit=45;svg.innerHTML=`<g transform="translate(${transform.x} ${transform.y}) scale(${transform.scale})">${edges.map(e=>{const a=pos.get(e.source),b=pos.get(e.target);return a&&b?`<line class="edge ${e.confidence}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"><title>${esc(e.kind)} · ${esc(e.confidence)}</title></line>`:''}).join('')}${nodes.map(n=>{const p=pos.get(n.id),size=Math.max(6,Math.min(20,6+Math.sqrt(n.degree||0)*2)),isSelected=selected?.id===n.id?' selected':'';const labelVisible=showLabels&&(nodes.length<=labelLimit||isSelected);return `<g data-id="${esc(n.id)}"><circle class="node${isSelected}" fill="${palette[n.kind]||'#9ba8c5'}" cx="${p.x}" cy="${p.y}" r="${size}"><title>${esc(n.name)} (${esc(n.kind)}) — click to explore</title></circle>${labelVisible?`<text class="label" text-anchor="middle" x="${p.x}" y="${p.y+size+15}">${esc(compactLabel(n.name))}</text>`:''}</g>`}).join('')}</g>`;
    svg.querySelectorAll('[data-id]').forEach(el=>el.onclick=e=>{e.stopPropagation();activate(nodeMap().get(el.dataset.id))});status.textContent=`${nodes.length} visible nodes · ${edges.length} visible relationships · ${mode==='overview'?'click a component to enter':nodes.length>labelLimit?'hover a node for its full label · focused scope':'focused scope'}`;
  }
  function select(node){if(!node)return;selected=node;render();const cached=[...pageCache.values()].filter(p=>p.focus.id===node.id).sort((a,b)=>a.offset-b.offset),last=cached.at(-1);details.innerHTML=`<h1>${esc(node.name)}</h1><span class="tag">${esc(node.kind)}</span><span class="tag">degree ${node.degree}</span>${node.package?`<p><b>Package</b><br>${esc(node.package)}</p>`:''}${node.path?`<p><b>Source</b><br><span class="path">${esc(node.path)}</span></p>`:''}${node.summary?`<p><b>Summary</b><br>${esc(node.summary)}</p>`:''}${last?.has_more?`<button id="explore">Explore next relationships</button><small>${last.graph.edges.length+last.offset} loaded; more are available.</small>`:''}<button id="architecture">Back to architecture</button>`;if(last?.has_more)document.querySelector('#explore').onclick=()=>explore(node.id,last.next_offset);document.querySelector('#architecture').onclick=architecture}
  function activate(node){if(!node)return;select(node);explore(node.id,0)}
  function architecture(){selected=null;setShown(graph(overview.nodes),'overview');details.innerHTML='<p>Click a component to enter it, or search for a symbol.</p>'}
  function mergePages(base,next){const nodes=new Map(base.nodes.map(n=>[n.id,n])),edges=new Map(base.edges.map(e=>[`${e.source}|${e.target}|${e.kind}`,e]));next.nodes.forEach(n=>nodes.set(n.id,n));next.edges.forEach(e=>edges.set(`${e.source}|${e.target}|${e.kind}`,e));return graph([...nodes.values()],[...edges.values()])}
  async function explore(id,offset){const key=id+':'+offset;try{status.textContent='Loading visible neighborhood…';let page=pageCache.get(key);if(!page){page=await json('/api/v1/neighbors?focus='+encodeURIComponent(id)+'&limit=160&offset='+offset);pageCache.set(key,page)};setShown(offset?mergePages(shown,page.graph):page.graph,'scope');select(page.focus)}catch(e){status.textContent=e.message}}
  let timer;document.querySelector('#search').oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();if(!q){document.querySelector('#results').innerHTML='';return}timer=setTimeout(async()=>{try{const data=await json('/api/v1/search?q='+encodeURIComponent(q));document.querySelector('#results').innerHTML=data.nodes.map(n=>`<button class="result" data-id="${esc(n.id)}"><b>${esc(n.name)}</b><br><small>${esc(n.kind)}${n.path?' · '+esc(n.path):''}</small></button>`).join('')||'<p>No graph nodes found.</p>';document.querySelectorAll('.result').forEach(b=>b.onclick=()=>activate(data.nodes.find(n=>n.id===b.dataset.id)))}catch(e){status.textContent=e.message}},180)};
  document.querySelector('#inferred').onchange=e=>{includeInferred=e.target.checked;render()};document.querySelector('#labels').onchange=e=>{showLabels=e.target.checked;render()};
  svg.addEventListener('wheel',e=>{e.preventDefault();const factor=e.deltaY<0?1.12:.89;transform.scale=Math.max(.25,Math.min(4,transform.scale*factor));render()},{passive:false});svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx:transform.x,ty:transform.y};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(drag){transform.x=drag.tx+e.clientX-drag.x;transform.y=drag.ty+e.clientY-drag.y;render()}});svg.addEventListener('pointerup',()=>drag=null);window.onresize=render;load();
  </script>
</body></html>
